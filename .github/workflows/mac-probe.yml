name: Mac runner probe

# Diagnostic: which hosted macOS labels can this account acquire? Manual only.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26, macos-15, macos-15-intel, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m
