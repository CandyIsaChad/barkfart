name: iOS IPA (unsigned)

# macOS minutes cost more on private repos: build the IPA on demand or for
# milestone tags (m0, m1, ...) only. Core tests run on Linux in ci.yml.
on:
  push:
    tags: ['m*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Core tests
        run: gradle core:test --no-daemon
      - name: Build unsigned IPA
        run: gradle ios:createIPA --no-daemon
      - name: Collect IPA
        run: |
          mkdir -p out
          find ios/build -name '*.ipa' -exec cp {} out/ \;
          ls -l out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: Barkfart-ipa
          path: out/*.ipa
          if-no-files-found: error
