name: Flutter app IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (macos-15, macos-14, macos-15-intel)"
        default: macos-15

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          cache-on-failure: true
      - name: Engine tests
        working-directory: engine
        run: cargo test -p barkfart-core
      - name: Build the engine for iOS
        working-directory: engine
        # one deployment target for Rust and the C++ video encoder (the app's)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: cargo build -p barkfart-ffi --release --target aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: Build the app
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Check the engine is in the app
        working-directory: app
        run: |
          xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -target Runner -configuration Release -sdk iphoneos 2>/dev/null | grep -E " (OTHER_LDFLAGS|STRIP_STYLE|DEAD_CODE_STRIPPING) =" || true
          ls -l build/ios/iphoneos/Runner.app/Runner
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep -E "_bf_(engine|render|cmd)" || { echo "engine functions missing from the app binary"; exit 1; }
      - name: Package unsigned IPA
        working-directory: app
        run: |
          # a new file name every build, so the iPad never saves "Barkfart.ipa 2"
          name="Barkfart-Next-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.ipa"
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qr "$name" Payload
          ls -l "$name"
      - name: Check the IPA opens as an app
        working-directory: app/out
        run: |
          ipa=$(ls *.ipa)
          file "$ipa"
          zip -T "$ipa"
          unzip -l "$ipa" | head -8
          rm -rf check && mkdir check && cd check && unzip -q "../$ipa"
          test -f Payload/Runner.app/Info.plist || { echo "no Payload/Runner.app/Info.plist"; exit 1; }
          plutil -lint Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleExecutable' -c 'Print :CFBundleShortVersionString' Payload/Runner.app/Info.plist
          file Payload/Runner.app/Runner
          lipo -info Payload/Runner.app/Runner
          du -sh Payload/Runner.app
      # The .ipa goes up as it is, not inside a zip: GitHub's streamed artifact
      # zip would not open in iOS Files ("Bad message"), and the download is
      # now the .ipa itself (artifact named after the file).
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: app/out/*.ipa
          archive: false
          if-no-files-found: error
