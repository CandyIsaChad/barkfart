apply plugin: 'application'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application { mainClass = 'app.barkfart.desktop.DesktopLauncher' }

// Shared assets (fonts) live in /assets; run from there so relative paths resolve.
tasks.named('run') { workingDir = rootProject.file('assets') }
// Pass -Dbarkfart.* from the gradle command line through to the app (docs folder, debug flags).
tasks.named('run') {
    System.properties.each { k, v -> if (k.toString().startsWith('barkfart.')) systemProperty k.toString(), v.toString() }
}
